services:
  - type: web
    name: mittal-dental-clinic
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Mittal Dental Clinic"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # generateValue: true (the original setting here) is wrong for
      # Laravel specifically: Render's auto-generated value doesn't
      # carry the required "base64:" prefix + 32-byte-decoded length,
      # so Laravel's Encrypter rejects it with "Unsupported cipher or
      # incorrect key length" — thrown while encrypting the session
      # cookie, which every real page touches but the /up health check
      # doesn't, which is why /up always worked while every actual page
      # 500'd. Generate a real one locally (`php artisan key:generate
      # --show`) and set it directly in the Render dashboard/API — not
      # here, since this repo is public and APP_KEY is a real secret.
      - key: APP_KEY
        sync: false
      # Render assigns the final hostname on first deploy — update this
      # to match if it differs (Settings → Environment on the service).
      - key: APP_URL
        value: "https://mittal-dental-clinic.onrender.com"
      # SQLite so this deploy doesn't need a second free-tier database
      # (Render allows only one free Postgres per account). Data resets
      # on every redeploy and on the free plan's idle spin-down/spin-up
      # cycle, since the disk isn't persistent — fine for letting people
      # preview the site, not a substitute for a real production database.
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      # Database, not file — survives the free plan's idle spin-down
      # (which wipes the ephemeral disk) between a page load and a form
      # submit. An earlier fix mistakenly blamed SQLite lock contention
      # here for the header-corruption crash; the actual cause was the
      # APP_KEY format above, unrelated to session storage.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
