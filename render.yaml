services:
  - type: web
    name: mittal-dental-clinic
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Mittal Dental Clinic"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      # Render assigns the final hostname on first deploy — update this
      # to match if it differs (Settings → Environment on the service).
      - key: APP_URL
        value: "https://mittal-dental-clinic.onrender.com"
      # SQLite so this deploy doesn't need a second free-tier database
      # (Render allows only one free Postgres per account). Data resets
      # on every redeploy and on the free plan's idle spin-down/spin-up
      # cycle, since the disk isn't persistent — fine for letting people
      # preview the site, not a substitute for a real production database.
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: log
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
