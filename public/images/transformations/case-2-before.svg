<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Placeholder illustration of worn, uneven front teeth before treatment">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFEDEA"/>
      <stop offset="1" stop-color="#E2DFDA"/>
    </linearGradient>
    <linearGradient id="toothB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DED7C9"/>
      <stop offset="1" stop-color="#C9BFAC"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgB)"/>

  <!-- gum line, dull tone -->
  <path d="M0 430 Q400 350 800 430 L800 600 L0 600 Z" fill="#C49AA6"/>
  <path d="M0 430 Q400 350 800 430 L800 470 Q400 392 0 470 Z" fill="#B98C99" opacity=".5"/>

  <!-- left incisor, worn edge -->
  <path d="M214 218 q0-20 20-20 h52 q20 0 20 20 v118 q0 46-46 46 t-46-46 z" fill="url(#toothB)" stroke="#BCB1A0" stroke-width="2"/>
  <ellipse cx="248" cy="300" rx="16" ry="21" fill="#A8977E" opacity=".45"/>

  <!-- centre incisor, worn down to a flat edge -->
  <path d="M330 206 q0-20 20-20 h54 q20 0 20 20 v116 q0 14-11 18 h-72 q-11-4-11-18 z" fill="url(#toothB)" stroke="#BCB1A0" stroke-width="2"/>
  <ellipse cx="360" cy="286" rx="13" ry="17" fill="#A8977E" opacity=".4"/>

  <path d="M444 210 q0-20 20-20 h54 q20 0 20 20 v124 q0 48-47 48 t-47-48 z" fill="url(#toothB)" stroke="#BCB1A0" stroke-width="2"/>
  <ellipse cx="500" cy="296" rx="15" ry="19" fill="#A8977E" opacity=".42"/>

  <!-- right incisor, tilted -->
  <g transform="rotate(7 600 300)">
    <path d="M558 220 q0-20 20-20 h52 q20 0 20 20 v116 q0 46-46 46 t-46-46 z" fill="url(#toothB)" stroke="#BCB1A0" stroke-width="2"/>
  </g>

  <text x="744" y="570" text-anchor="end" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17" fill="#000" opacity=".28">Sample visual</text>
</svg>
