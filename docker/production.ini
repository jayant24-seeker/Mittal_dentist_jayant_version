; Never print raw PHP warnings/notices/deprecations into the HTTP
; response — that's what caused the "headers already sent" crash on
; Render (some warning got echoed before Laravel could send its own
; response). Send them to stderr instead, where Render's log viewer
; picks them up, same as Laravel's own application logs.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; The official PHP Docker image ships no php.ini at all, so output
; buffering defaults to off — any stray byte anywhere (a single
; whitespace character, a BOM, an early warning) gets flushed straight
; to the browser instead of being held back, which is what breaks
; "headers already sent" once Laravel tries to send real headers
; afterward. A local machine's PHP install almost always has this set
; already, which is why the same code runs fine there.
output_buffering = 4096
